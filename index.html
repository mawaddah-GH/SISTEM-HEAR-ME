<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#16285A">
<title>Sistem HEAR ME</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: navy hero band with tabs (same family as PA Presiden), then a single working column of cards */
:root{
  --navy:#16285A; --navy-2:#22397A; --gold:#C9A227; --gold-soft:#F3E7BF;
  --bg:#F6F7FB; --paper:#FFFFFF; --ink:#151B2E; --muted:#5E6782; --line:#DCE1EC;
  --ok:#1F7A4D; --ok-bg:#E3F3EA; --warn:#9A6A00; --warn-bg:#FBF0D2; --bad:#B3261E; --bad-bg:#FBE6E4;
  --info:#22397A; --info-bg:#E3E9F8; --onnavy:#C9D2EE; --ongold:#1B1606;
  --display:"Playfair Display",Georgia,serif; --body:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --navy:#0E1A3D; --navy-2:#1B2D63; --gold:#E2BE4E; --gold-soft:#3A3218;
  --bg:#0D1222; --paper:#161D33; --ink:#E9ECF5; --muted:#9AA3BE; --line:#2A3354;
  --ok:#6FD3A0; --ok-bg:#16352A; --warn:#F0C25A; --warn-bg:#3A2E10; --bad:#FF8A80; --bad-bg:#3D1A18;
  --info:#A9BDF5; --info-bg:#1E2A52; color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#0E1A3D; --navy-2:#1B2D63; --gold:#E2BE4E; --gold-soft:#3A3218;
  --bg:#0D1222; --paper:#161D33; --ink:#E9ECF5; --muted:#9AA3BE; --line:#2A3354;
  --ok:#6FD3A0; --ok-bg:#16352A; --warn:#F0C25A; --warn-bg:#3A2E10; --bad:#FF8A80; --bad-bg:#3D1A18;
  --info:#A9BDF5; --info-bg:#1E2A52; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.band{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:880px;margin:0 auto}
.hero{background:var(--navy);color:#fff;padding-block:20px 0}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--onnavy)}
.brand b{color:var(--gold);font-weight:600}
.save{font-size:12px;color:var(--onnavy)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,5vw,34px);line-height:1.15;margin:12px 0 2px;text-wrap:balance}
.sub{color:var(--onnavy);font-size:14px;margin:0}
.tabs{display:flex;gap:4px;margin-top:18px;overflow-x:auto;padding-bottom:14px}
.tabs button{background:transparent;border:0;color:var(--onnavy);padding:8px 14px;border-radius:99px;font-weight:500;white-space:nowrap}
.tabs button[aria-current="page"]{background:var(--gold);color:var(--ongold)}
.tabs .n{font-size:11px;background:rgba(255,255,255,.14);border-radius:99px;padding:0 6px;margin-left:4px}
.tabs button[aria-current="page"] .n{background:rgba(0,0,0,.12)}
main{padding-block:20px 60px}
.notice{border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:14px;background:var(--warn-bg);color:var(--warn)}
.notice.info{background:var(--info-bg);color:var(--info)}
.sec{margin:0 0 26px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 10px;flex-wrap:wrap}
.sechead h2{font-family:var(--display);font-size:21px;margin:0}
.sechead span{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left}
.stat b{display:block;font-size:26px;font-weight:600;line-height:1.15}
.stat span{font-size:12.5px;color:var(--muted)}
.stat.bad{background:var(--bad-bg);border-color:transparent}.stat.bad b,.stat.bad span{color:var(--bad)}
.stat.ok b{color:var(--ok)}
.stat.gold{background:var(--gold-soft);border-color:transparent}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}}
.hours{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hcard{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.hcard .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hcard .nm{font-weight:600}
.hcard .hr{font-family:var(--display);font-size:28px;line-height:1}
.hcard .hr small{font-family:var(--body);font-size:13px;color:var(--muted);margin-left:3px}
.bar{height:6px;border-radius:99px;background:var(--bg);margin:10px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.hcard .meta{font-size:12.5px;color:var(--muted)}
.clock{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
@media (max-width:520px){.hours{grid-template-columns:1fr}}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--navy-2)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--ongold);font-weight:600}
.btn.navy{background:var(--navy-2);border-color:var(--navy-2);color:#fff}
.btn.sm{font-size:13px;padding:5px 11px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.55;cursor:default}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:5px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--navy-2);color:#fff;border-color:var(--navy-2)}
.spacer{flex:1}
.item{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.item.open{border-color:var(--gold)}
.item.late{border-left:4px solid var(--bad)}
.item.soon{border-left:4px solid var(--warn)}
.item.done .t{color:var(--muted);text-decoration:line-through}
.row{display:grid;grid-template-columns:62px 1fr auto;gap:14px;align-items:center;padding:12px 14px;width:100%;text-align:left;background:none;border:0}
.date{text-align:center;border-right:1px solid var(--line);padding-right:12px}
.date .d{font-family:var(--display);font-size:24px;line-height:1;display:block;color:var(--navy-2)}
:root[data-theme="dark"] .date .d{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .date .d{color:var(--gold)}}
.date .w{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.date .none{font-size:12px;color:var(--muted)}
.t{font-weight:600;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.s{font-size:13px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--bg);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.chip.gold{background:var(--gold-soft);color:var(--ink);border-color:transparent}
.right{text-align:right;font-size:13px;color:var(--muted)}
.right b{display:block;font-size:15px;color:var(--ink)}
.prog{width:70px;height:5px;background:var(--bg);border-radius:99px;overflow:hidden;margin:6px 0 0 auto}
.prog i{display:block;height:100%;background:var(--ok)}
@media (max-width:560px){.row{grid-template-columns:52px 1fr}.row .right{grid-column:2;text-align:left}.prog{margin-left:0}}
.form{border-top:1px dashed var(--line);padding:14px;display:grid;grid-template-columns:repeat(6,1fr);gap:10px 12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);grid-column:span 2;min-width:0}
.form label.w3{grid-column:span 3}.form label.w6{grid-column:1/-1}
.form input,.form select,.form textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);color:var(--ink);font-size:14.5px;min-width:0;width:100%}
.form textarea{resize:vertical;min-height:44px}
.form .actions{grid-column:1/-1;display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;align-items:center}
@media (max-width:620px){.form{grid-template-columns:repeat(2,1fr)}.form label,.form label.w3{grid-column:span 1}.form label.w6{grid-column:1/-1}}
.takwim{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line);font-size:13px;background:var(--bg)}
.takwim .msg{flex:1;min-width:0;color:var(--muted)}
.takwim .msg.ok{color:var(--ok)}.takwim .msg.bad{color:var(--bad)}
.up{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.upc{background:var(--paper);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:10px;padding:12px 14px;text-align:left;width:100%}
.upc .when{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.upc .when b{color:var(--ink)}
.upc .t{margin:4px 0 2px}
.list{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lrow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.lrow:first-child{border-top:0}
.lrow .t{font-weight:500}
.empty{text-align:center;padding:32px 16px;color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:12px;font-size:14px}
.target{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14px}
.target .seg{margin-top:8px}
.target .warnbox{margin-top:10px;background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:10px 12px;font-size:13px}
.target .warnbox .btn{margin-top:8px}
a{color:var(--info)}
@media (prefers-reduced-motion:no-preference){.item,.btn{transition:border-color .15s}}

.iconbtn{background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:2px 9px;font-size:14px;margin-left:6px}
.iconbtn:hover{border-color:var(--gold)}
.foot{font-size:12.5px;color:var(--muted);margin-top:30px;text-align:center}
.linkbtn{background:none;border:0;color:var(--info);text-decoration:underline;padding:0;font-size:inherit}
.setup{min-height:100%;display:grid;place-items:center;padding-block:40px}
.setup .card{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:14px;padding:24px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px}
.setup h1{margin:0;color:var(--ink)}
.brand2{font-size:13px;color:var(--muted)}.brand2 b{color:var(--gold)}
.setup label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.setup input{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg);color:var(--ink);font-size:15px;width:100%;min-width:0}
.muted{color:var(--muted);font-size:13px;margin:0}

.grow{flex:1;min-width:0;display:block}
.lrow .s,.lrow .t{display:block}
.lrow.static{cursor:default}
.lrow .amt{white-space:nowrap}
.badtxt{color:var(--bad)}
.muted-list{opacity:.75}
.stats.three{grid-template-columns:repeat(3,1fr);margin-bottom:24px}
@media (max-width:620px){.stats.three{grid-template-columns:1fr 1fr 1fr}.stats.three .stat b{font-size:20px}}
.stat b{overflow-wrap:anywhere}
.stat.warn{background:var(--warn-bg);border-color:transparent}.stat.warn b,.stat.warn span{color:var(--warn)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.card.dec{border-left:4px solid var(--gold);border-radius:4px 12px 12px 4px}
.card.dec.answered{border-left-color:var(--ok)}
.card .t{font-weight:600}
.card input[type=text]{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--bg);color:var(--ink);margin-top:10px;font-size:14.5px}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.opts .btn{flex:1;min-width:110px;padding:11px 14px}
.done-note{font-size:14px;color:var(--ok);margin-top:4px}
.next .when{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.next .when b{color:var(--warn)}
.next .big{font-family:var(--display);font-size:22px;line-height:1.25;margin:6px 0 4px;text-wrap:balance}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{font-size:13px;padding:6px 12px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--ink);text-decoration:none}
a.pill:hover{border-color:var(--gold)}
.points{margin:10px 0 0;padding-left:18px;font-size:14px}
.points li{margin-bottom:3px}
.week{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.day{display:grid;grid-template-columns:84px 1fr;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day .dl{padding:10px 12px;font-size:12px;color:var(--muted);border-right:1px solid var(--line)}
.day .dl b{display:block;color:var(--ink);font-size:14.5px}
.day.today .dl{background:var(--gold-soft)}
.day .items{padding:8px 12px;display:flex;flex-direction:column;gap:5px;font-size:14px;justify-content:center;min-width:0}
.it{display:flex;gap:8px;align-items:baseline}
.it small{color:var(--muted);min-width:40px;font-size:12px}
.it.org{color:var(--info)}.it.fam{color:var(--ok);font-size:12.5px}.it.clash{color:var(--bad);font-weight:600}
.empty-day{color:var(--muted);font-size:13px}
.task-row{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
.task-row:first-child{border-top:0}
.task-row input{margin-top:3px;width:20px;height:20px;accent-color:var(--navy-2);flex:none}
.claimbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:16px}
.claimbar .btn{margin-left:auto}
.monthnav{display:flex;align-items:center;gap:8px}
.monthnav b{font-family:var(--display);font-size:18px;min-width:140px;text-align:center}
.famrow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-top:8px}
.famrow label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.famrow input{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);color:var(--ink);width:130px}
.paystaf{display:flex;flex-direction:column;gap:2px;padding:4px 12px;border-left:1px solid var(--line)}
.hours.one{grid-template-columns:1fr}
.btn.big{padding:14px 22px;font-size:17px;width:100%}
.detail{border-top:1px dashed var(--line);padding:12px 14px;font-size:14px}
.detail p{margin:0 0 6px}
.item.past{opacity:.7}
.uprow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--ink);font-size:13.5px}
.uprow .btn{cursor:pointer}
.visually-hidden,.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.h2{font-family:var(--display);font-size:20px;margin:0}
.tablewrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:12px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:9px 12px;border-top:1px solid var(--line);text-align:left}
.tbl thead th{border-top:0;font-size:12.5px;color:var(--muted);font-weight:600}
.tbl .n{text-align:right;white-space:nowrap}
@media (max-width:440px){.tabs button{padding:7px 10px;font-size:14px}.tabs{gap:2px}}
.date.sm{min-width:52px;padding-right:10px}.date.sm .d{font-size:20px}
.lrow .chips{display:flex}.lrow .chips a{font-size:12px;align-self:center}
.live{color:var(--ok);font-weight:600}
html,body{height:100%}
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js?v=20261104"></script>
</body>
</html>
