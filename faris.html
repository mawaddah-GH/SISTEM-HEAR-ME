<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#16285A">
<title>Hantar Video · HEAR ME</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#16285A; --navy-2:#22397A; --gold:#C9A227; --gold-soft:#F3E7BF;
  --bg:#F6F7FB; --paper:#FFFFFF; --ink:#151B2E; --muted:#5E6782; --line:#DCE1EC;
  --ok:#1F7A4D; --ok-bg:#E3F3EA; --warn:#9A6A00; --warn-bg:#FBF0D2; --bad:#B3261E; --bad-bg:#FBE6E4;
  --info:#22397A; --info-bg:#E3E9F8; --onnavy:#C9D2EE; --ongold:#1B1606;
  --display:"Playfair Display",Georgia,serif; --body:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --navy:#0E1A3D; --navy-2:#1B2D63; --gold:#E2BE4E; --gold-soft:#3A3218;
  --bg:#0D1222; --paper:#161D33; --ink:#E9ECF5; --muted:#9AA3BE; --line:#2A3354;
  --ok:#6FD3A0; --ok-bg:#16352A; --warn:#F0C25A; --warn-bg:#3A2E10; --bad:#FF8A80; --bad-bg:#3D1A18;
  --info:#A9BDF5; --info-bg:#1E2A52; color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);font-variant-numeric:tabular-nums}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.band{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto}
.hero{background:var(--navy);color:#fff;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:22px}
.brand{font-size:13px;color:var(--onnavy)}.brand b{color:var(--gold);font-weight:600}
h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.15;margin:10px 0 4px}
.sub{color:var(--onnavy);font-size:14px;margin:0}
main{padding-block:18px calc(48px + env(safe-area-inset-bottom,0px))}
.quota{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:-34px;position:relative}
.quota .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.quota .big{font-family:var(--display);font-size:40px;line-height:1}
.quota .big small{font-family:var(--body);font-size:16px;color:var(--muted);margin-left:4px}
.quota .rm{text-align:right;font-size:13px;color:var(--muted)}.quota .rm b{display:block;font-size:17px;color:var(--ink)}
.bar{height:8px;border-radius:99px;background:var(--bg);margin:12px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.quota.full .bar i{background:var(--bad)}
.card{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:14px;padding:18px;margin-top:16px;display:flex;flex-direction:column;gap:14px}
.card h2{font-family:var(--display);font-size:21px;margin:0}
label{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--muted);font-weight:500}
input,textarea{border:1px solid var(--line);border-radius:10px;padding:12px 13px;background:var(--bg);color:var(--ink);font-size:16px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 16px;font-weight:600}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--ongold);font-size:17px;padding:15px 20px;width:100%}
.btn:disabled{opacity:.55;cursor:default}
.btn.sm{font-size:13px;padding:6px 12px;font-weight:500}
.btn.danger{color:var(--bad)}
.notice{border-radius:10px;padding:12px 14px;font-size:15px}
.notice.ok{background:var(--ok-bg);color:var(--ok)}
.notice.bad{background:var(--bad-bg);color:var(--bad)}
.notice.warn{background:var(--warn-bg);color:var(--warn)}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:26px 0 10px}
.sechead h2{font-family:var(--display);font-size:21px;margin:0}
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav b{font-size:14px;min-width:110px;text-align:center}
.list{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.v{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.v:first-child{border-top:0}
.v .no{font-family:var(--display);font-size:22px;color:var(--navy-2);text-align:center}
@media (prefers-color-scheme: dark){.v .no{color:var(--gold)}}
.v .t{font-weight:600;overflow-wrap:anywhere}
.v .s{font-size:13px;color:var(--muted)}
.v .s a{color:var(--info)}
.chip{font-size:12.5px;padding:3px 10px;border-radius:99px;white-space:nowrap;font-weight:600}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.empty{text-align:center;padding:28px 16px;color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:14px;font-size:15px}
.steps{margin:0;padding-left:20px;font-size:14.5px;color:var(--muted)}.steps li{margin-bottom:4px}.steps a{color:var(--info);font-weight:600}
.foot{font-size:12.5px;color:var(--muted);margin-top:28px;text-align:center}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div id="app"><header class="hero band"><div class="wrap"><div class="brand"><b>HEAR ME</b> · Video Isyarat</div><h1>Hantar Video</h1><p class="sub">Memuatkan…</p></div></header></div>
<script>
/* v20261125b — Borang video isyarat Faris. Data masuk ke tab "Video Faris" dalam Google Sheet Sistem HEAR ME. */
const API_URL='https://script.google.com/macros/s/AKfycbzeapEY_NbMEDpKfJym-wbqJ99ziJkj-_VuGWMmzsnRK_KVcRwpUhfzTVRDYuI5hE_n/exec';
const FARIS_PIN='2741';   // mesti sama dengan VIDEO.pin dalam Video.gs
const NAMA='Faris';
const FOLDER='https://drive.google.com/drive/folders/1RYo7NZsgaiTq2lzMBFGvYqKSojoVpSVM';   // folder video isyarat Faris

const BULAN=['Januari','Februari','Mac','April','Mei','Jun','Julai','Ogos','September','Oktober','November','Disember'];
const BLN=['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const thisMonth=()=>todayISO().slice(0,7);
const monthLabel=m=>{const [y,mm]=m.split('-');return BULAN[+mm-1]+' '+y};
const shiftMonth=(m,d)=>{const [y,mm]=m.split('-').map(Number);const x=new Date(y,mm-1+d,1);return x.getFullYear()+'-'+pad(x.getMonth()+1)};
const rm=n=>'RM '+Number(n||0).toLocaleString('ms-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>'v'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);

let V=[],LIMIT=10,RATE=10,vm=thisMonth(),state='loading',note=null,busy=false,askDel=null,draft={date:todayISO(),title:'',link:'',note:''},loadErr='';

async function load(){
  try{
    const r=await fetch(API_URL+'?pin='+encodeURIComponent(FARIS_PIN));const j=await r.json();
    if(!j.ok)throw new Error(j.error||'Ralat');
    V=j.data.videos||[];LIMIT=+(j.cfg&&j.cfg.videoLimit)||10;RATE=+(j.cfg&&j.cfg.videoRate)||10;state='ready';loadErr='';
  }catch(e){state=V.length?'ready':'error';loadErr='Tak dapat sambung. Semak internet dan cuba lagi.'}
  render();
}
async function call(body){
  const r=await fetch(API_URL,{method:'POST',body:JSON.stringify({...body,pin:FARIS_PIN})});
  const j=await r.json();if(!j.ok){const e=new Error(j.error||'Ralat');e.code=j.code;throw e}return j;
}
const inMonth=m=>V.filter(v=>String(v.date||'').startsWith(m)).sort((a,b)=>String(a.date).localeCompare(String(b.date))||(a.row||0)-(b.row||0));

function render(){
  const app=$('#app');
  if(state!=='ready'){
    app.innerHTML=`<header class="hero band"><div class="wrap"><div class="brand"><b>HEAR ME</b> · Video Isyarat</div><h1>Hantar Video</h1><p class="sub">${state==='loading'?'Memuatkan…':''}</p></div></header>
    ${state==='error'?`<main class="band"><div class="wrap"><div class="notice bad">${esc(loadErr)}</div><p><button class="btn" data-reload="1">Cuba lagi</button></p></div></main>`:''}`;return;
  }
  const cur=inMonth(thisMonth()),n=cur.length,full=n>=LIMIT,left=Math.max(0,LIMIT-n);
  const paid=cur.filter(v=>v.status==='Dibayar').length;
  const list=inMonth(vm);
  let h=`<header class="hero band"><div class="wrap"><div class="brand"><b>HEAR ME</b> · Video Isyarat</div><h1>Hai ${NAMA} 👋</h1><p class="sub">Hantar link setiap video isyarat yang siap. Pastikan link betul sebelum hantar. ${rm(RATE)} satu video, maksimum ${LIMIT} video sebulan.</p><div style="height:30px"></div></div></header>
  <main class="band"><div class="wrap">
  <div class="quota ${full?'full':''}"><div class="top"><span class="big">${n}<small>/ ${LIMIT} video</small></span><span class="rm">${BULAN[new Date().getMonth()]}<b>${rm(n*RATE)}</b></span></div>
    <div class="bar"><i style="width:${Math.min(100,n/LIMIT*100)}%"></i></div>
    <div style="font-size:14px;color:${full?'var(--bad)':'var(--muted)'}">${full?'Had bulan ini dah penuh. Video baru boleh dihantar bulan depan.':`Boleh hantar ${left} video lagi bulan ini.`}${paid?` · ${paid} dah dibayar`:''}</div></div>`;
  if(note)h+=`<div class="notice ${note.cls}" style="margin-top:16px" role="status">${note.html}</div>`;
  if(!full){
    h+=`<form class="card" id="f"><h2>Video baru</h2>
      <ol class="steps"><li>Upload video ke <a href="${FOLDER}" target="_blank" rel="noopener">folder Drive HEAR ME ↗</a></li><li>Dalam Drive, tekan ⋮ pada video → <b>Share</b> → <b>Copy link</b></li><li>Tampal link video tu di bawah</li></ol>
      <label for="f-link">Link video (Google Drive)<input id="f-link" type="url" inputmode="url" placeholder="https://drive.google.com/file/d/…" value="${esc(draft.link)}" required></label>
      <label for="f-title">Tajuk / perkataan isyarat<input id="f-title" type="text" placeholder="cth. Salam perkenalan" value="${esc(draft.title)}" required></label>
      <label for="f-date">Tarikh siap<input id="f-date" type="date" value="${esc(draft.date)}" max="${todayISO()}" required></label>
      <label for="f-note">Catatan (jika ada)<textarea id="f-note">${esc(draft.note)}</textarea></label>
      <button class="btn primary" type="submit" ${busy?'disabled':''}>${busy?'Menghantar…':'Hantar video'}</button></form>`;
  }
  h+=`<div class="sechead"><h2>Video saya</h2><div class="monthnav"><button class="btn sm" data-month="-1" aria-label="Bulan sebelum">‹</button><b>${monthLabel(vm)}</b><button class="btn sm" data-month="1" aria-label="Bulan seterusnya" ${vm>=thisMonth()?'disabled':''}>›</button></div></div>`;
  h+=list.length?`<div class="list">${list.map((v,i)=>{const d=new Date(v.date+'T00:00');
    return `<div class="v"><span class="no">${i+1}</span><span><span class="t">${esc(v.title||'(Tanpa tajuk)')}</span><br><span class="s">${isNaN(d)?'':d.getDate()+' '+BLN[d.getMonth()]+' · '}${v.link?`<a href="${esc(v.link)}" target="_blank" rel="noopener">Buka video ↗</a>`:''}</span></span>
      <span class="side">${v.status==='Dibayar'?'<span class="chip ok">✓ Dibayar</span>':'<span class="chip warn">Belum dibayar</span>'}</span></div>`}).join('')}</div>`
    :`<div class="empty">Tiada video untuk ${monthLabel(vm)}.</div>`;
  h+=`<p class="foot">Tersalah hantar? Maklumkan admin HEAR ME untuk pembetulan. Video yang dihantar adalah hak milik HEAR ME.</p></div></main>`;
  app.innerHTML=h;
}
function keepDraft(){const f=$('#f');if(!f)return;draft={date:$('#f-date').value,title:$('#f-title').value,link:$('#f-link').value,note:$('#f-note').value}}

document.addEventListener('submit',async e=>{
  if(e.target.id!=='f')return;e.preventDefault();if(busy)return;keepDraft();
  const link=draft.link.trim(),title=draft.title.trim();
  if(/\/drive\/folders\//.test(link)){note={cls:'bad',html:'Ini link <b>folder</b>. Sila tampal link <b>video</b> tu sendiri (tekan ⋮ pada video → Share → Copy link).'};render();$('#f-link')?.focus();return}
  if(!/^https?:\/\//i.test(link)){note={cls:'bad',html:'Sila tampal link video yang betul (bermula dengan https://).'};render();$('#f-link')?.focus();return}
  const dup=V.find(v=>String(v.link).trim()===link);
  if(dup&&!confirm('Link ini dah pernah dihantar ("'+(dup.title||'')+'"). Hantar juga?'))return;
  const item={id:uid(),date:draft.date||todayISO(),title,link,note:draft.note.trim()};
  busy=true;note=null;render();
  try{const j=await call({a:'save',kind:'videos',item});V.push(j.item||{...item,status:'Belum dibayar'});
    draft={date:todayISO(),title:'',link:'',note:''};vm=thisMonth();note={cls:'ok',html:`✓ Video <b>${esc(title)}</b> dah dihantar. Terima kasih!`};}
  catch(err){note={cls:'bad',html:esc(err.message&&err.message!=='Failed to fetch'?err.message:'Tak pasti berjaya (masalah internet). Muat semula halaman dan semak senarai sebelum hantar lagi.')}}
  busy=false;render();scrollTo({top:0,behavior:'smooth'});
});
document.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.reload){state='loading';render();load();return}
  if(d.month){keepDraft();vm=shiftMonth(vm,+d.month);askDel=null;render();return}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state==='ready'&&!busy){keepDraft();load()}});
load();
</script>
</body>
</html>
